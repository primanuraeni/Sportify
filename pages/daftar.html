
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Sportify</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<section class="auth-page">
    <div class="auth-box">

        <h1 class="auth-brand">Sportify</h1>

        <h2>Buat Akun Baru</h2>
        <p class="auth-subtitle">
            Daftar untuk mulai memesan lapangan
        </p>

        <form class="auth-form" id="registerForm">

            <div class="input-wrap">
                <img src="../assets/icons/user.png">
                <input type="text" placeholder="Nama Lengkap" required>
            </div>

            <div class="input-wrap">
                <img src="../assets/icons/email (1).png">
                <input type="text" placeholder="Masukkan email atau nomor telepon" required>
            </div>

<div class="input-wrap password-wrap">
    <img src="../assets/icons/padlock.png" alt="Password">

    <input type="password"
           id="password"
           placeholder="Masukkan kata sandi"
           required>

    <img src="../assets/icons/hidden.png"
         class="eye-toggle"
         alt="Lihat password"
         onclick="togglePassword('password', this)">
</div>

<div class="input-wrap password-wrap">
    <img src="../assets/icons/padlock.png" alt="Konfirmasi Password">

    <input type="password"
           id="confirmPassword"
           placeholder="Konfirmasi kata sandi"
           required>

    <img src="../assets/icons/hidden.png"
         class="eye-toggle"
         alt="Lihat password"
         onclick="togglePassword('confirmPassword', this)">
</div>

            <button type="submit" class="auth-submit warna-teks-putih">
                Daftar
            </button>

        </form>

        <p class="auth-foot">
            Sudah Punya Akun? <a href="login.html" class="warna-teks">Login</a>
        </p>

    </div>
</section>

<script>
    

function togglePassword(id, icon) {
    const password = document.getElementById(id);

    if (password.type === "password") {
        password.type = "text";
        icon.src = "../assets/icons/eye.png";
    } else {
        password.type = "password";
        icon.src = "../assets/icons/hidden.png";
    }
}

const registerForm = document.getElementById("registerForm");

if (registerForm) {
    registerForm.addEventListener("submit", function(e) {
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirmPassword").value;

        if (password !== confirm) {
            e.preventDefault();
            alert("Konfirmasi kata sandi tidak sesuai!");
        }
    });
}

</script>

</body>
</html>
