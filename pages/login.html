<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sportify</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    
<main class="auth-page">
    <section class="auth-box">
        <h1 class="auth-brand">Sportify</h1>
        <h2>Selamat Datang Kembali</h2>
        <p class="auth-subtitle">Login untuk melanjutkan</p>
<form class="auth-form" action="../index.html">
    <label class="input-wrap">
        <img src="../assets/icons/email (1).png" alt="Email">
        <input required placeholder="Masukkan email atau nomor telepon anda" autocomplete="username">
    </label>

<div class="input-wrap password-wrap">
    <img src="../assets/icons/padlock.png" alt="Password">

    <input type="password"
           id="password"
           placeholder="Masukkan kata sandi"
           required>

    <img src="../assets/icons/hidden.png"
         class="eye-toggle"
         alt="Lihat password"
         onclick="togglePassword('password', this)">
</div>
</label>
<button class="auth-submit warna-teks-putih" type="submit">Login</button>
</form>
<div class="divider-text">atau</div>
<a class="google-btn" href="../index.html">
    <img src="../assets/icons/google (1).png" alt="Google">Login dengan Google</a>
    <p class="auth-foot">Belum Punya Akun? <a href="daftar.html" class="warna-teks">Daftar</a>
    </p>
</section>
</main>
<script>
    
function togglePassword(id, icon) {
    const password = document.getElementById(id);

    if (password.type === "password") {
        password.type = "text";

        icon.src = "../assets/icons/eye.png";

        icon.classList.remove("eye-off");
        icon.classList.add("eye-on");

    } else {
        password.type = "password";

        icon.src = "../assets/icons/hidden.png";

        icon.classList.remove("eye-on");
        icon.classList.add("eye-off");
    }
}

const registerForm = document.getElementById("registerForm");

if (registerForm) {
    registerForm.addEventListener("submit", function(e) {
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirmPassword").value;

        if (password !== confirm) {
            e.preventDefault();
            alert("Konfirmasi kata sandi tidak sesuai!");
        } else {
            e.preventDefault();
            alert("Pendaftaran berhasil!");
        }
    });
}


</script>
</body>
</html>
